name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Inject config
        run: |
          cat > js/config.js << 'EOF'
          window.APP_CONFIG = {
            scriptUrl:   '${{ secrets.SCRIPT_URL }}',
            secretToken: '${{ secrets.SECRET_TOKEN }}',
            ytApiKey:    '${{ secrets.YT_API_KEY }}',
            ytChannelId: '${{ secrets.YT_CHANNEL_ID }}',
            sendQuoteUrl: '${{ secrets.SEND_QUOTE_URL }}'
          };
          EOF
          sed -i '/js\/config\.js/d' .gitignore

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github'
